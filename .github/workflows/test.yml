name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly: dependency advisories land without any push, so re-audit on a
    # timer. Only the audit job runs on this trigger.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Floor matches requires-python; the newest release guards against
        # deprecations landing in a future ComfyUI runtime.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # requirements-dev.txt pulls in requirements.txt (requests, Pillow,
        # numpy, lmstudio). The suite stubs lmstudio and comfy when they are
        # missing, so it also has to pass without a running LM Studio - the
        # startup model fetch simply fails to connect and is handled.
        run: pip install -r requirements-dev.txt
      - name: Lint (undefined names, unused/duplicate imports)
        # Cheap gate for the bug class tests cannot see: a name used but never
        # imported only raises on the code path that uses it.
        run: pyflakes .
      - name: Run tests
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit the versions a fresh install resolves to
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Audit the declared floors
        run: |
          # pip never upgrades an installed package that still satisfies a
          # '>=' floor, so the floor is what long-lived ComfyUI installs run.
          # Pin each floor to '==X' and audit that.
          python - <<'EOF' > floors.txt
          import re
          for line in open("requirements.txt"):
              line = line.split("#")[0].strip()
              if not line:
                  continue
              m = re.match(r"^([A-Za-z0-9._-]+(?:\[[^\]]+\])?)>=([^,;\s]+)", line)
              if m:
                  print(f"{m.group(1)}=={m.group(2)}")
          EOF
          cat floors.txt
          # --disable-pip: look the pins up without installing them. Installing
          # takes minutes and fails on old floors with no wheel for this Python.
          pip-audit --no-deps --disable-pip -r floors.txt --progress-spinner off

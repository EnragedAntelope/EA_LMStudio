[project]
name = "EA_LMStudio"
description = "Run local LLMs and vision models from LM Studio in ComfyUI: prompt enhancing, multi-image captioning, reasoning split from the answer, schema-constrained JSON output, cancellable streaming, and a confirmed VRAM unload before image generation."
version = "2.4.2"
license = {file = "LICENSE"}
# 3.11: Pillow 13.0.0, the first release clearing the CVEs found against 12.x,
# requires it. Python 3.10 reached end-of-life in October 2026.
requires-python = ">=3.11"
dependencies = [
    # Floor: 1.5.0 is the only release CI and live runs exercise. Ceiling: the
    # SDK is pre-2.0 and the node leans on its internals (stream cancel,
    # reasoning_type fragments, the silent key drop); retest before allowing 2.x.
    # 1.6 prereleases (api_token) still satisfy this range.
    "lmstudio>=1.5.0,<2",
    # Floors are security floors: each is the first release clearing the known
    # CVEs in the one before (weekly CI audit checks them). Keep in step with
    # requirements.txt.
    "requests>=2.33.0",
    "Pillow>=13.0.0",
    "numpy>=1.22.0",
]

[project.urls]
Repository = "https://github.com/EnragedAntelope/EA_LMStudio"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "enragedantelope"
DisplayName = "EA_LMStudio"
Icon = ""

[tool.pytest.ini_options]
# importlib mode avoids treating the repo root (which has an __init__.py for the
# ComfyUI node package) as an importable package, so tests can import the
# dependency-light modules directly without pulling in the lmstudio SDK/ComfyUI.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
